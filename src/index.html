<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cotizadores Ceven</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;color:#1d1d1f;font-size:13px;min-height:100vh}
  .lbl{font-size:11px;color:#6e6e73;font-weight:500;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px}
  .inp{border:0.5px solid #d2d2d7;border-radius:8px;padding:9px 11px;font-size:14px;width:100%;outline:none;margin-bottom:13px;font-family:inherit}
  .err{display:none;background:#fff0f0;color:#d70015;font-size:12px;padding:8px 11px;border-radius:8px;margin-bottom:13px}
  .btn-dark{border:none;border-radius:980px;padding:11px;font-size:14px;font-weight:500;cursor:pointer;background:#1d1d1f;color:#fff;font-family:inherit}
  .btn-bar{border:0.5px solid #d2d2d7;border-radius:980px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:#1d1d1f;font-family:inherit;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .brand-card{background:#fff;border:0.5px solid #d2d2d7;border-radius:16px;padding:30px 26px;width:220px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.05);transition:transform .15s ease, box-shadow .15s ease}
  .brand-card.active{cursor:pointer}
  .brand-card.active:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.10)}
  .brand-card.soon{opacity:.45;pointer-events:none}
  .brand-badge{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#6e6e73;background:#ebebed;border-radius:980px;padding:3px 10px;margin-top:10px}
</style>
</head>
<body>

<!-- ============================================================
     LOGIN  ·  Acceso a los cotizadores (Supabase Auth)
     Usuarios se gestionan desde el botón "👤 Usuarios" (solo admin@ceven.com).
     ============================================================ -->
<div id="ceven-login" style="position:fixed;inset:0;z-index:99999;background:#f5f5f7;display:flex;align-items:center;justify-content:center">
  <div style="background:#fff;border:0.5px solid #d2d2d7;border-radius:16px;padding:34px 32px;width:340px;max-width:90vw;box-shadow:0 10px 40px rgba(0,0,0,.08)">
    <div style="text-align:center;margin-bottom:22px">
      <div style="font-size:30px;line-height:1">🔐</div>
      <div style="font-size:19px;font-weight:600;color:#1d1d1f;margin-top:8px">Cotizadores Ceven</div>
      <div style="font-size:13px;color:#6e6e73;margin-top:2px">Inicia sesión para continuar</div>
    </div>
    <form id="ceven-login-form" onsubmit="return cevenDoLogin(event)">
      <label class="lbl">Usuario (email @ceven.com)</label>
      <input id="ceven-user" type="email" autocomplete="username" autofocus placeholder="nombre@ceven.com" class="inp">
      <label class="lbl">Contraseña</label>
      <input id="ceven-pass" type="password" autocomplete="current-password" class="inp">
      <label style="display:flex;align-items:center;gap:7px;font-size:13px;color:#1d1d1f;margin-bottom:16px;cursor:pointer">
        <input id="ceven-remember" type="checkbox" checked style="width:auto;margin:0"> Mantener sesión iniciada
      </label>
      <div id="ceven-login-err" class="err"></div>
      <button type="submit" class="btn-dark" style="width:100%">Entrar</button>
    </form>
  </div>
</div>

<!-- ============================================================
     PANEL SELECTOR DE MARCAS
     ============================================================ -->
<div id="brand-panel" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px">
  <div style="text-align:center;margin-bottom:34px">
    <div style="font-size:26px;font-weight:600;color:#1d1d1f">Cotizadores Ceven</div>
    <div style="font-size:14px;color:#6e6e73;margin-top:4px">Elegí la marca con la que vas a trabajar</div>
  </div>
  <div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center">
    <div class="brand-card active" onclick="location.href='apple/'" title="Abrir cotizador Apple">
      <div style="font-size:44px;line-height:1">🍎</div>
      <div style="font-size:17px;font-weight:600;margin-top:12px">Apple</div>
      <div style="font-size:12px;color:#6e6e73;margin-top:3px">Mac · iPhone · iPad · CevenCare</div>
    </div>
    <div class="brand-card soon">
      <div style="font-size:44px;line-height:1">🎧</div>
      <div style="font-size:17px;font-weight:600;margin-top:12px">Poly</div>
      <div style="font-size:12px;color:#6e6e73;margin-top:3px">Audio y video conferencia</div>
      <div class="brand-badge">Próximamente</div>
    </div>
    <div class="brand-card soon">
      <div style="font-size:44px;line-height:1">💻</div>
      <div style="font-size:17px;font-weight:600;margin-top:12px">HP</div>
      <div style="font-size:12px;color:#6e6e73;margin-top:3px">Notebooks e impresión</div>
      <div class="brand-badge">Próximamente</div>
    </div>
  </div>
</div>

<!-- Barra de cuenta (abajo a la derecha) -->
<div id="ceven-account-bar" style="display:none;position:fixed;bottom:16px;right:16px;z-index:9000;gap:8px">
  <button id="ceven-users-btn" onclick="cevenOpenUsers()" title="Gestionar usuarios" class="btn-bar">👤 Usuarios</button>
  <button onclick="cevenChangeMyPassword()" title="Cambiar mi contraseña" class="btn-bar">🔑 Cambiar contraseña</button>
  <button onclick="cevenLogout()" title="Cerrar sesión" class="btn-bar">🚪 <span id="ceven-logout-label">Salir</span></button>
</div>

<!-- Modal: gestión de usuarios -->
<div id="ceven-users-modal" style="display:none;position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.3);align-items:center;justify-content:center">
  <div style="background:#fff;border:0.5px solid #d2d2d7;border-radius:16px;padding:26px 26px;width:400px;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.15)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:17px;font-weight:600;color:#1d1d1f">👤 Usuarios</div>
      <button onclick="cevenCloseUsers()" style="border:none;background:none;font-size:20px;cursor:pointer;color:#6e6e73;line-height:1">×</button>
    </div>
    <form onsubmit="return cevenCreateUser(event)" style="border:0.5px solid #d2d2d7;border-radius:12px;padding:14px;margin-bottom:16px">
      <div style="font-size:13px;font-weight:600;color:#1d1d1f;margin-bottom:10px">Crear usuario nuevo</div>
      <input id="ceven-new-user" type="email" placeholder="nombre@ceven.com" class="inp" style="font-size:13px;padding:8px 10px;margin-bottom:8px">
      <input id="ceven-new-pass" type="password" autocomplete="new-password" placeholder="Contraseña (mínimo 6 caracteres)" class="inp" style="font-size:13px;padding:8px 10px;margin-bottom:8px">
      <input id="ceven-new-nombre" type="text" placeholder="Nombre (vendedor), ej: Fer Castro" class="inp" style="font-size:13px;padding:8px 10px;margin-bottom:8px">
      <select id="ceven-new-role" class="inp" style="font-size:13px;padding:8px 10px;margin-bottom:10px;background:#fff">
        <option value="admin">Administrador</option>
        <option value="ventas" selected>Ventas</option>
        <option value="lector">Lector</option>
      </select>
      <div id="ceven-users-err" class="err" style="font-size:12px;padding:7px 10px;margin-bottom:10px"></div>
      <button type="submit" class="btn-dark" style="padding:8px 16px;font-size:13px">Crear</button>
    </form>
    <div class="lbl" style="margin-bottom:6px">Usuarios actuales</div>
    <div id="ceven-users-list" style="max-height:240px;overflow-y:auto"></div>
  </div>
</div>

<!-- Modal: editar perfil (nombre + rol) de un usuario existente -->
<div id="ceven-edit-profile-modal" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.3);align-items:center;justify-content:center">
  <div style="background:#fff;border:0.5px solid #d2d2d7;border-radius:16px;padding:26px 26px;width:360px;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.15)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:17px;font-weight:600;color:#1d1d1f">Editar usuario</div>
      <button onclick="cevenCloseEditProfile()" style="border:none;background:none;font-size:20px;cursor:pointer;color:#6e6e73;line-height:1">×</button>
    </div>
    <form onsubmit="return cevenSubmitEditProfile(event)">
      <div id="ceven-edit-profile-email" style="font-size:13px;color:#6e6e73;margin-bottom:10px"></div>
      <input id="ceven-edit-profile-nombre" type="text" placeholder="Nombre (vendedor)" class="inp" style="font-size:13px;padding:8px 10px;margin-bottom:8px">
      <select id="ceven-edit-profile-role" class="inp" style="font-size:13px;padding:8px 10px;margin-bottom:10px;background:#fff">
        <option value="admin">Administrador</option>
        <option value="ventas">Ventas</option>
        <option value="lector">Lector</option>
      </select>
      <div id="ceven-edit-profile-err" class="err" style="font-size:12px;padding:7px 10px;margin-bottom:10px"></div>
      <button type="submit" class="btn-dark" style="padding:8px 16px;font-size:13px">Guardar</button>
    </form>
  </div>
</div>

<script src="shared/config.js"></script>
<script src="shared/auth.js"></script>

</body>
</html>
