<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tareas del equipo · Ceven</title>
<meta name="description" content="Tablero de tareas del equipo Ceven: to do, doing y done, con delegación por miembro.">

<!-- PWA (instalable + offline). El service worker se registra en ../shared/pwa.js. -->
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ceven Tareas">

<!-- Sin dark.css, igual que el shell: esta página es parte del panel, no de un
     cotizador, y la navbar no le muestra el botón de modo oscuro. -->
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="css/board.css">
</head>
<body>

<!-- ============================================================
     El login y la gestión de usuarios viven en el shell (../index.html).
     Esta página exige sesión válida (guard más abajo, tras cargar auth.js).
     ============================================================ -->
<script src="../shared/safe.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/notify.js"></script>
<script>if(!cevenIsValidSession()) location.replace('../index.html');</script>

<!-- Identidad de esta página para la navbar: no es una marca (no hay brand.js,
     ni tema, ni ítems de vista), pero sí cuelga un nivel abajo de la raíz, así
     que el chip vuelve al panel. Ver el bloque CEVEN_PAGE de shared/navbar.js. -->
<script>window.CEVEN_PAGE = {label: 'Tareas', icon: '✅'};</script>
<script src="../shared/navbar.js"></script>

<main class="tablero">

  <header class="tb-hd">
    <div>
      <h1 class="h1">Tareas del equipo</h1>
      <p class="sub">Compartidas entre todas las marcas · se sincronizan solas cada 15&nbsp;s</p>
    </div>
  </header>

  <!-- ── Equipo ───────────────────────────────────────────────────────────
       Doble función: arrastrar un miembro sobre una tarjeta la delega, y
       clickearlo filtra el tablero por lo que tiene asignado. -->
  <section class="tb-equipo">
    <div class="lbl">Equipo <span class="tb-tip">— arrastrá a alguien sobre una tarea para delegársela, o tocalo para filtrar</span></div>
    <div class="tb-chips" id="equipo-chips"></div>
    <div class="tb-nota" id="equipo-nota" hidden></div>
  </section>

  <!-- ── Alta ─────────────────────────────────────────────────────────────
       El estado se elige acá para poder cargar algo directo en "Doing" sin
       tener que crearlo y moverlo. -->
  <form class="tb-alta" id="tb-alta" hidden>
    <input id="tarea-texto" type="text" placeholder="Nueva tarea…" autocomplete="off" maxlength="500">
    <select id="tarea-estado" aria-label="Columna donde se crea la tarea">
      <option value="todo">To do</option>
      <option value="doing">Doing</option>
      <option value="done">Done</option>
    </select>
    <button type="submit">Agregar</button>
  </form>
  <div class="tb-solo-lectura" id="tb-solo-lectura" hidden>
    Tu rol es <b>lector</b>: podés ver el tablero, pero no crear, mover ni delegar tareas.
  </div>

  <!-- ── Tablero ──────────────────────────────────────────────────────────
       El esqueleto va en el HTML y el JS repinta solo los cuerpos: los
       listeners de arrastre viven en #tb-cols por delegación, así que no hay
       que recablear nada en cada render. -->
  <div class="tb-cols" id="tb-cols">
    <section class="col" data-estado="todo">
      <div class="col-hd"><span class="col-dot"></span><b>To do</b><span class="col-cnt" data-cnt>0</span></div>
      <div class="col-body" data-body></div>
    </section>
    <section class="col" data-estado="doing">
      <div class="col-hd"><span class="col-dot"></span><b>Doing</b><span class="col-cnt" data-cnt>0</span></div>
      <div class="col-body" data-body></div>
    </section>
    <section class="col" data-estado="done">
      <div class="col-hd"><span class="col-dot"></span><b>Done</b><span class="col-cnt" data-cnt>0</span></div>
      <div class="col-body" data-body></div>
    </section>
  </div>

</main>

<script src="../shared/nav.js"></script>
<script src="../shared/todos.js"></script>
<script src="js/board.js"></script>
<script src="../shared/pwa.js"></script>

</body>
</html>
